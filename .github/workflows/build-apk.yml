
name: Build HyperCat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q HyperCatAI-MobileBuild.zip -d extracted
          cp -a extracted/HyperCatAI/. .

      - name: Fix Compose import
        run: |
          sed -i '/import androidx.compose.ui.platform.setContent/d' app/src/main/java/com/hypercat/ai/MainActivity.kt

      - name: Verify project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/hypercat/ai/MainActivity.kt

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperCatAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
