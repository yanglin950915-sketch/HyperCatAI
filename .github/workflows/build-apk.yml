
name: Build HyperCat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q HyperCatAI-MobileBuild.zip -d extracted
          cp -a extracted/HyperCatAI/. .

      - name: Restore Compose import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/hypercat/ai/MainActivity.kt")
          s = p.read_text()
          imp = "import androidx.compose.ui.platform.setContent"

          if imp not in s:
              lines = s.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      lines.insert(i + 1, "")
                      lines.insert(i + 2, imp)
                      break
              else:
                  raise SystemExit("Cannot find Kotlin package declaration")
              p.write_text("\n".join(lines) + "\n")

          print("Compose import checked/restored")
          PY

      - name: Verify project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/hypercat/ai/MainActivity.kt
          grep -n "compose.ui.platform.setContent" app/src/main/java/com/hypercat/ai/MainActivity.kt

      - name: Build APK
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --console=plain > build.log 2>&1
          RESULT=$?
          echo "===== KOTLIN ERRORS ====="
          grep -n -A 5 -B 3 -E '(^e: | error:|What went wrong)' build.log || true
          echo "===== LAST 100 LINES ====="
          tail -n 100 build.log
          exit $RESULT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HyperCatAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
