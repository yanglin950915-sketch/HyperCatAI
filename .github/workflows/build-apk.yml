
name: Build HyperCat AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q HyperCatAI-MobileBuild.zip -d extracted
          cp -a extracted/HyperCatAI/. .

      - name: Inspect source for repair
        run: |
          echo "===== MAIN ACTIVITY ====="
          sed -n '1,320p' app/src/main/java/com/hypercat/ai/MainActivity.kt
          echo "===== ANDROID MANIFEST ====="
          find app/src/main -name AndroidManifest.xml -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;
          echo "===== KOTLIN FILE LIST ====="
          find app/src/main/java -type f -name '*.kt' -print

      - name: Fix Activity Compose import
        run: |
          FILE="app/src/main/java/com/hypercat/ai/MainActivity.kt"
          if grep -q 'import androidx.compose.ui.platform.setContent' "$FILE"; then
            sed -i '/import androidx.compose.ui.platform.setContent/d' "$FILE"
          fi
          if ! grep -q 'import androidx.activity.compose.setContent' "$FILE"; then
            sed -i '/^package /a import androidx.activity.compose.setContent' "$FILE"
          fi
          echo "===== CURRENT IMPORTS ====="
          grep '^import ' "$FILE"

      - name: Verify project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/hypercat/ai/MainActivity.kt

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperCatAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
